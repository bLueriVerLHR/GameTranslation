name: CI

# Python 3.14 is the only supported baseline. Windows and Linux are both
# required: default console encodings and filesystem behavior still differ.
# No secrets, private dictionaries, fonts or game trees are required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.12.21"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==${{ env.UV_VERSION }}"
          python -m uv sync --locked --python 3.14 --extra images --extra fonts --extra dev
      - name: Compile every source file
        run: uv run --no-sync python -m compileall -q rpgmaker kirikiri tyrano wolfrpg unity translation tools tests
      - name: Lint (ruff, rules pinned in pyproject.toml)
        run: uv run --no-sync python -m ruff check .
      - name: Type budgets (mypy)
        run: uv run --no-sync python -m tools.mypy_check
      - name: Documentation tree is in sync with the repo
        run: uv run --no-sync python -m tools.check_docs
      - name: Public-repo hygiene
        run: uv run --no-sync python -m pytest tests/test_repo_hygiene.py -q -n 0
      - name: Skip inventory
        run: uv run --no-sync python -m tools.skip_report --verbose
      - name: Unit and contract tests (PR layer)
        run: uv run --no-sync python -m pytest tests -q --junitxml=junit.xml -m "not slow and not media and not node and not engine_runtime and not wsl and not browser and not device"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit.xml
          if-no-files-found: ignore

  coverage:
    name: coverage (branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==${{ env.UV_VERSION }}"
          python -m uv sync --locked --python 3.14 --extra images --extra fonts --extra dev
      - name: Measure branch coverage
        # No marker filter: codecs and nightly layers must remain measured.
        run: uv run --no-sync python -m pytest tests -q --cov --cov-branch --cov-report=xml --cov-report=term --cov-report=json:coverage.json
      - name: Enforce the recorded coverage floors
        run: uv run --no-sync python -m tools.check_coverage coverage.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  lock:
    name: uv.lock is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check the lockfile against pyproject.toml
        run: |
          python -m pip install "uv==${{ env.UV_VERSION }}"
          python -m uv lock --check --no-progress

  wheel:
    # Deliberately install the built artifact, not an editable checkout.
    name: installed artifact is usable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the wheel and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest pytest-xdist setuptools
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Assert the wheel ships every documented entry point
        run: python -m pytest tests/test_wheel_contents.py -q -n 0

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==${{ env.UV_VERSION }}"
          python -m uv sync --locked --python 3.14 --extra images --extra fonts --extra dev
          uv pip install pip-audit
      - name: Audit installed dependencies
        run: uv run --no-sync python -m pip_audit --progress-spinner off

  nightly:
    name: nightly layers (slow, media, node, engine runtime)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==${{ env.UV_VERSION }}"
          python -m uv sync --locked --python 3.14 --extra images --extra fonts --extra dev
      - name: "Media layer (real codecs: libvpx-vp9, libvorbis)"
        run: uv run --no-sync python -m pytest tests -q -m "media" --junitxml=junit-media.xml
      - name: Node layer (external Node.js binary)
        run: uv run --no-sync python -m pytest tests -q -m "node" --junitxml=junit-node.xml
      - name: Engine runtime layer (a real engine tree must be present)
        # No engine tree is provisioned; its explicit skip remains visible.
        run: uv run --no-sync python -m pytest tests -q -m "engine_runtime" --junitxml=junit-engine.xml
      - name: Slow layer (numba JIT, artifact builds, mutation table)
        run: uv run --no-sync python -m pytest tests -q -m "slow" --junitxml=junit-slow.xml
      - name: Install pytest-randomly (nightly only)
        # Keep the plugin outside [dev] so ordinary local tests stay ordered.
        run: uv pip install pytest-randomly
      - name: Random order (the suite must not depend on execution order)
        run: uv run --no-sync python -m pytest tests -q -p randomly -m "not slow and not media and not node and not engine_runtime and not wsl and not browser and not device" --junitxml=junit-random.xml
      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-nightly
          path: junit-*.xml
          if-no-files-found: ignore
